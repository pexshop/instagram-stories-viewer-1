name: Validate Worker and Instaloader service

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "instaloader-service/**"
      - ".github/workflows/validate-worker.yml"
  pull_request:
    paths:
      - "worker.js"
      - "instaloader-service/**"
      - ".github/workflows/validate-worker.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q instaloader-service
